services:
  website:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mia.example.com}
    container_name: mia-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/codes.db
    volumes:
      - ./data:/app/data
      - ./public/memes:/app/public/memes
      - ./public/pic:/app/public/pic
