services:
  website:
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_WINDCHIME_DISPLAY_URL: ${NEXT_PUBLIC_WINDCHIME_DISPLAY_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mia.example.com}
    container_name: mia-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/codes.db
      - WINDCHIME_MEDIA_DIRECTORY=/app/data/mail-media
    volumes:
      - ./data:/app/data
      - ./public/memes:/app/public/memes
      - ./public/pic:/app/public/pic

  caddy:
    image: caddy:2-alpine
    container_name: mia-caddy
    restart: unless-stopped
    depends_on:
      - website
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
